# Throwaway PostgreSQL for the integration suite.
#
#   docker compose up -d
#   DBHARNESS_TEST_PG_DSN=postgresql://postgres:dbharness@localhost:55432/dbharness \
#     PYTHONPATH=src python -m pytest tests/integration -v
#   docker compose down
#
# Or just run scripts/run_pg_integration.sh, which wraps all of this.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: dbharness
      POSTGRES_DB: dbharness
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dbharness"]
      interval: 2s
      timeout: 3s
      retries: 15
